[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudprac"
version = "0.1.0"
description = "AWS Cloud Computing Practical Automation Engine for AWS CloudShell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ankush Khakale", email = "khakaleankush@gmail.com" }
]
keywords = ["aws", "cloudshell", "cloud-computing", "automation", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cloudprac = "cloudprac.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudprac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
